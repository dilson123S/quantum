# ==============================================================================
# Quantum Trading Bot — Receta Oficial de Fine-Tuning con Soup (RTX 3050 4GB)
# Modelo Base: Qwen/Qwen2.5-3B-Instruct (Caché local en .soup/layer-stream)
# Optimización: Layer Streaming + 4-bit LoRA (Consumo VRAM < 3.2 GB)
# ==============================================================================

base: Qwen/Qwen2.5-3B-Instruct
task: sft

data:
  train: ml/quantum-slm/quantum_train_alpaca.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 1024

training:
  epochs: 3
  lr: 2e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  stream_layers: true
  lora:
    r: 16
    alpha: 32
    target_modules: auto
  quantization: 4bit

output: ml/quantum-slm/outputs/quantum-slm-qwen2.5-3b
