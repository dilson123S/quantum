risk:
  mode: percent
  # A high-frequency validation profile must use materially smaller loss per
  # trade than the slow baseline.  These limits apply in paper and demo too.
  risk_percent: 0.25
  risk_money: 20.0
  max_daily_loss: 1.0
  max_drawdown: 5.0
  max_consecutive_losses: 4
  max_open_positions: 3
  max_positions_per_symbol: 1
  max_correlated_positions: 1
  max_risk_per_trade: 0.25
  # Three simultaneous 0.25% risks are the maximum aggregated exposure.
  max_portfolio_risk_percent: 0.75
  max_correlation: 0.80
