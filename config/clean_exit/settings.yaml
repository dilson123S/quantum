bot:
  name: QuantTradingBot-CleanExit
  magic_number: 26082401
  mode: paper
  allow_live_trading: false
market:
  symbols:
  - USDJPY
  - XAUUSD
timeframes:
  higher: H4
  setup: H1
  entry: M15
score:
  minimum: 75
  min_structure: 18
  min_trend: 15
  structure_weight: 30
  trend_weight: 25
  momentum_weight: 15
  volume_weight: 15
  volatility_weight: 15
structure:
  swing_lookback: 3
  swing_confirmation: 2
  bos_min_distance_atr: 0.1
  bos_close_confirmation: true
  use_choch: true
  use_bos: true
  max_swing_age: 100
trend:
  ema_fast: 20
  ema_medium: 50
  ema_slow: 200
  adx_period: 14
  adx_min: 20
  adx_strong: 25
momentum:
  rsi_period: 14
  rsi_bull_min: 50
  rsi_bull_strong: 55
  rsi_bear_max: 50
  rsi_bear_strong: 45
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
volume:
  period: 20
  min_ratio: 1.2
  strong_ratio: 1.5
  use_obv: true
  volume_mode: tick
volatility:
  atr_period: 14
  atr_avg_period: 50
  min_atr_ratio: 0.8
  max_atr_ratio: 2.5
  sl_multiplier: 1.5
trade:
  risk_reward: 2.0
  break_even_r: 2.5  # above risk_reward: never triggers, isolates the pure TP/SL outcome
  partial_close: false
  partial_r: 1.5
  partial_percent: 50
  trailing: "off"
  entry_mode: breakout
  breakout_buffer_points: 5
  breakout_expiry_bars: 4
filters:
  max_spread: true
  session_filter: true
  news_filter: false
  correlation_filter: true
  trading_start: 07:00
  trading_end: '17:00'
  timezone: UTC
  max_spread_atr_percent: 10
  news_blackout_before: 30
  news_blackout_after: 30
telemetry:
  # Preserve rejected candidates for OOS analysis; this does not route orders.
  log_rejected_score_candidates: true
  target_daily_trades: 0
ml:
  enabled: true
  # The existing model has no cost-aware, untouched out-of-sample evidence.
  # Keep it observational until this is demonstrated by the new backtester.
  shadow_mode: true
  allow_active_filter: false
  model_path: data/ml_model.joblib
  min_confidence: 0.65
  retrain_weeks: 4
  training_months: 6
decision_context:
  # Regime, liquidity and Fibonacci are telemetry until validated OOS.
  enabled: true
  shadow_mode: true
  history_bars: 650
  equal_level_tolerance_atr: 0.15
  fib_zone_atr: 0.15
  smc_max_age_bars: 40
  smc_min_gap_atr: 0.10
  sweep_min_penetration_atr: 0.05
regime_filter:
  # Record every would-be block before making this a trading permission.
  enabled: true
  shadow_mode: true
  min_adx: 20
  min_bb_width_ratio: 0.90
  max_range_bb_width_ratio: 1.05
  block_ranging: true
  block_low_volatility: true
smc_filter:
  enabled: true
  shadow_mode: true
  require_sweep: false
  require_fvg_or_order_block: false
backtest:
  # IC Markets-style FX estimate. Replace only with values verified from
  # account statements, then create a new immutable experiment manifest.
  commission_per_lot_round_turn: 7.0
  slippage_points: 1.0
  gap_slippage_points: 2.0
  intra_bar_policy: stop_first
